[mod-name]
GlowingLaserBeams=Leuchtende Laserstrahlen

[mod-description]
GlowingLaserBeams=Passe die Farbe und das Bodenleuchten von Laserstrahlen an oder aktiviere den Disco-Modus, um bei jedem Schuss eine zufällige Regenbogenfarbe abzufeuern. Funktioniert mit Vanilla- und Mod-Laserwaffen.

[mod-setting-name]
laserfix-doubletint=Laserkern doppelt einfärben
laserfix-color=Laser-Farbmodus
laserfix-core-color=Laserkern-Farbe
laserfix-glow-color=Bodenleuchten-Farbe

[mod-setting-description]
laserfix-doubletint=Wendet die gewählte Farbe zusätzlich auf die helle innere Lichtebene des Laserstrahls an, wodurch die Farben tiefer und gesättigter wirken.
laserfix-color=Wähle zwischen einer einzelnen benutzerdefinierten Farbe oder dem Disco-Modus, der bei jedem Laserschuss eine zufällige Regenbogenfarbe abfeuert.
laserfix-core-color=Farbe des eigentlichen Laserstrahls. Gilt nur, wenn der Laser-Farbmodus auf „Benutzerdefinierte Farbe“ eingestellt ist.
laserfix-glow-color=Farbe des Lichts, das unter dem Laserstrahl auf den Boden geworfen wird. Gilt nur, wenn der Laser-Farbmodus auf „Benutzerdefinierte Farbe“ eingestellt ist.

[string-mod-setting]
laserfix-color-Custom=Benutzerdefinierte Farbe
laserfix-color-Disco=Disco (Zufällige Farben)

[string-mod-setting-description]
laserfix-color-Custom=Verwendet die unten eingestellten Farben für alle Laserstrahlen und das Bodenleuchten.
laserfix-color-Disco=Wählt bei jedem Laserschuss zufällig eine von 8 kräftigen Regenbogenfarben aus.
