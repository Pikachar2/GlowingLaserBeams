[mod-name]
GlowingLaserBeams=Faisceaux Laser Lumineux

[mod-description]
GlowingLaserBeams=Personnalisez la couleur et la lueur au sol des faisceaux laser, ou activez le mode Disco pour tirer une couleur arc-en-ciel aléatoire à chaque tir. Compatible avec les armes laser du jeu de base et des mods.

[mod-setting-name]
laserfix-doubletint=Double teinte du cœur laser
laserfix-color=Mode de couleur des lasers
laserfix-core-color=Couleur du cœur laser
laserfix-glow-color=Couleur de la lueur au sol

[mod-setting-description]
laserfix-doubletint=Applique également la teinte choisie à la couche lumineuse interne du faisceau laser, rendant les couleurs plus profondes et saturées.
laserfix-color=Choisissez entre une couleur personnalisée unique ou le mode Disco, qui tire une couleur arc-en-ciel aléatoire à chaque tir laser.
laserfix-core-color=Couleur du faisceau laser lui-même. S'applique uniquement lorsque le mode de couleur est réglé sur Couleur personnalisée.
laserfix-glow-color=Couleur de la lumière projetée sur le sol sous le faisceau laser. S'applique uniquement lorsque le mode de couleur est réglé sur Couleur personnalisée.

[string-mod-setting]
laserfix-color-Custom=Couleur personnalisée
laserfix-color-Disco=Disco (Couleurs aléatoires)

[string-mod-setting-description]
laserfix-color-Custom=Utilise les couleurs personnalisées configurées ci-dessous pour tous les faisceaux laser et la lueur au sol.
laserfix-color-Disco=Sélectionne aléatoirement parmi 8 couleurs arc-en-ciel éclatantes à chaque tir laser.
