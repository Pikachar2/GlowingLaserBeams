[mod-name]
GlowingLaserBeams=Rayos Láser Brillantes

[mod-description]
GlowingLaserBeams=Personaliza el color y el brillo en el suelo de los rayos láser, o activa el modo Disco para disparar un color arcoíris aleatorio en cada disparo. Funciona con armas láser del juego base y de mods.

[mod-setting-name]
laserfix-doubletint=Doble tinte en el núcleo del láser
laserfix-color=Modo de color del láser
laserfix-core-color=Color del núcleo del láser
laserfix-glow-color=Color del brillo en el suelo

[mod-setting-description]
laserfix-doubletint=Aplica el color seleccionado también a la capa interior brillante del rayo láser, haciendo que los colores se vean más profundos y saturados.
laserfix-color=Elige entre un único color personalizado o el modo Disco, que dispara un color arcoíris aleatorio en cada disparo láser.
laserfix-core-color=Color del propio rayo láser. Solo se aplica cuando el modo de color del láser está en Color personalizado.
laserfix-glow-color=Color de la luz proyectada en el suelo debajo del rayo láser. Solo se aplica cuando el modo de color del láser está en Color personalizado.

[string-mod-setting]
laserfix-color-Custom=Color personalizado
laserfix-color-Disco=Disco (Colores aleatorios)

[string-mod-setting-description]
laserfix-color-Custom=Usa los colores personalizados configurados abajo para todos los rayos láser y el brillo en el suelo.
laserfix-color-Disco=Selecciona aleatoriamente entre 8 colores arcoíris vibrantes cada vez que dispara un láser.
