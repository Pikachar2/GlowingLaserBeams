[mod-name]
GlowingLaserBeams=Świecące Wiązki Laserowe

[mod-description]
GlowingLaserBeams=Dostosuj kolor i poświatę na ziemi wiązek laserowych lub włącz tryb Disco, aby przy każdym strzale wystrzeliwać losowy kolor tęczy. Działa z bronią laserową z gry podstawowej oraz modów.

[mod-setting-name]
laserfix-doubletint=Podwójne zabarwienie rdzenia lasera
laserfix-color=Tryb koloru lasera
laserfix-core-color=Kolor rdzenia lasera
laserfix-glow-color=Kolor poświaty na ziemi

[mod-setting-description]
laserfix-doubletint=Nakłada wybrany kolor również na jasną wewnętrzną warstwę światła wiązki laserowej, dzięki czemu kolory są głębsze i bardziej nasycone.
laserfix-color=Wybierz pojedynczy własny kolor lub tryb Disco, który przy każdym strzale lasera losuje kolor tęczy.
laserfix-core-color=Kolor samej wiązki laserowej. Działa tylko wtedy, gdy tryb koloru lasera jest ustawiony na Własny kolor.
laserfix-glow-color=Kolor światła rzucanego na ziemię pod wiązką laserową. Działa tylko wtedy, gdy tryb koloru lasera jest ustawiony na Własny kolor.

[string-mod-setting]
laserfix-color-Custom=Własny kolor
laserfix-color-Disco=Disco (Losowe kolory)

[string-mod-setting-description]
laserfix-color-Custom=Używa własnych kolorów skonfigurowanych poniżej dla wszystkich wiązek laserowych i poświaty na ziemi.
laserfix-color-Disco=Losowo wybiera jeden z 8 żywych kolorów tęczy przy każdym wystrzale lasera.
