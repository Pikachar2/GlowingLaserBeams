[mod-name]
GlowingLaserBeams=빛나는 레이저 빔

[mod-description]
GlowingLaserBeams=레이저 빔의 색상과 지면 발광 효과를 사용자 지정하거나, 디스코 모드를 활성화하여 발사할 때마다 무작위 무지개 색상을 발사합니다. 바닐라 및 모드 레이저 무기와 호환됩니다.

[mod-setting-name]
laserfix-doubletint=레이저 코어 이중 틴트
laserfix-color=레이저 색상 모드
laserfix-core-color=레이저 코어 색상
laserfix-glow-color=지면 발광 색상

[mod-setting-description]
laserfix-doubletint=레이저 빔의 밝은 내부 빛 레이어에도 선택한 색상을 적용하여 색감을 더욱 깊고 선명하게 만듭니다.
laserfix-color=단일 사용자 지정 색상 또는 발사할 때마다 무작위 무지개 색상을 발사하는 디스코 모드 중 하나를 선택합니다.
laserfix-core-color=레이저 빔 자체의 색상입니다. 레이저 색상 모드가 '사용자 지정 색상'으로 설정된 경우에만 적용됩니다.
laserfix-glow-color=레이저 빔 아래 지면에 비치는 빛의 색상입니다. 레이저 색상 모드가 '사용자 지정 색상'으로 설정된 경우에만 적용됩니다.

[string-mod-setting]
laserfix-color-Custom=사용자 지정 색상
laserfix-color-Disco=디스코 (무작위 색상)

[string-mod-setting-description]
laserfix-color-Custom=모든 레이저 빔과 지면 발광에 아래에서 설정한 사용자 지정 색상을 사용합니다.
laserfix-color-Disco=레이저가 발사될 때마다 8가지 선명한 무지개 색상 중 하나를 무작위로 선택합니다.
