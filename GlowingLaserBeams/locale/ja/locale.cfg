[mod-name]
GlowingLaserBeams=発光レーザービーム

[mod-description]
GlowingLaserBeams=レーザービームの色と地面の光をカスタマイズしたり、ディスコモードを有効にして発射ごとにランダムな虹色のレーザーを放つことができます。バニラおよびMODのレーザー兵器に対応しています。

[mod-setting-name]
laserfix-doubletint=レーザーコアの二重着色
laserfix-color=レーザーカラーモード
laserfix-core-color=レーザーコアの色
laserfix-glow-color=地面の発光色

[mod-setting-description]
laserfix-doubletint=レーザービームの明るい内側の光レイヤーにも選択した色を適用し、より深く鮮やかな発色にします。
laserfix-color=単一のカスタムカラー、または発射ごとにランダムな虹色を放つディスコモードから選択します。
laserfix-core-color=レーザービーム自体の色です。レーザーカラーモードが「カスタムカラー」の場合のみ適用されます。
laserfix-glow-color=レーザービームの下の地面に映る光の色です。レーザーカラーモードが「カスタムカラー」の場合のみ適用されます。

[string-mod-setting]
laserfix-color-Custom=カスタムカラー
laserfix-color-Disco=ディスコ（ランダムカラー）

[string-mod-setting-description]
laserfix-color-Custom=すべてのレーザービームと地面の光に以下で設定したカスタムカラーを使用します。
laserfix-color-Disco=レーザー発射ごとに8種類の鮮やかな虹色からランダムに1色を選択します。
