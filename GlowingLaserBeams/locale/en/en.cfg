[mod-setting-name]
laserfix-doubletint=Double tint laser core
laserfix-color=Laser color mode
laserfix-core-color=Laser core color
laserfix-glow-color=Ground glow color

[mod-setting-description]
laserfix-doubletint=Applies the selected color tint to the bright inner light layer of the laser beam in addition to the outer beam layer, making colors appear deeper and more saturated.
laserfix-color=Choose between a single custom color or Disco mode, which fires a random rainbow color on every laser shot.
laserfix-core-color=Color of the laser beam itself. Only applies when Laser color mode is set to Custom Color.
laserfix-glow-color=Color of the light cast onto the ground beneath the laser beam. Only applies when Laser color mode is set to Custom Color.

[string-mod-setting]
laserfix-color-Custom=Custom Color
laserfix-color-Disco=Disco (Random Colors)

[string-mod-setting-description]
laserfix-color-Custom=Uses the custom colors configured below for all laser beams and ground glow.
laserfix-color-Disco=Randomly selects from 8 vibrant rainbow colors each time a laser fires.
