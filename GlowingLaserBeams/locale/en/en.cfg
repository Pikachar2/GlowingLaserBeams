[mod-setting-name]
laserfix-doubletint=Double tint laser core
laserfix-color=Laser color mode
laserfix-r=Laser core - Red (0-255)
laserfix-g=Laser core - Green (0-255)
laserfix-b=Laser core - Blue (0-255)
laserfix-glow-r=Ground glow - Red (0-255)
laserfix-glow-g=Ground glow - Green (0-255)
laserfix-glow-b=Ground glow - Blue (0-255)

[mod-setting-description]
laserfix-doubletint=Applies the selected color tint to the bright inner light layer of the laser beam in addition to the outer beam layer, making colors appear deeper and more saturated.
laserfix-color=Choose between a single custom RGB color or Disco mode, which fires a random rainbow color on every laser shot.
laserfix-r=Red channel intensity (0-255) for the laser beam. Only applies when Laser color mode is set to Custom RGB.
laserfix-g=Green channel intensity (0-255) for the laser beam. Only applies when Laser color mode is set to Custom RGB.
laserfix-b=Blue channel intensity (0-255) for the laser beam. Only applies when Laser color mode is set to Custom RGB.
laserfix-glow-r=Red channel intensity (0-255) for the light cast onto the ground beneath the laser beam. Only applies when Laser color mode is set to Custom RGB.
laserfix-glow-g=Green channel intensity (0-255) for the light cast onto the ground beneath the laser beam. Only applies when Laser color mode is set to Custom RGB.
laserfix-glow-b=Blue channel intensity (0-255) for the light cast onto the ground beneath the laser beam. Only applies when Laser color mode is set to Custom RGB.

[string-mod-setting]
laserfix-color-Custom=Custom RGB
laserfix-color-Disco=Disco (Random Colors)

[string-mod-setting-description]
laserfix-color-Custom=Uses the custom RGB values configured below for all laser beams and ground glow.
laserfix-color-Disco=Randomly selects from 8 vibrant rainbow colors each time a laser fires.
