[mod-name]
GlowingLaserBeams=Feixes de Laser Brilhantes

[mod-description]
GlowingLaserBeams=Personalize a cor e o brilho no chão dos feixes de laser, ou ative o modo Disco para disparar uma cor aleatória do arco-íris a cada tiro. Funciona com armas laser do jogo base e de mods.

[mod-setting-name]
laserfix-doubletint=Tonalidade dupla no núcleo do laser
laserfix-color=Modo de cor do laser
laserfix-core-color=Cor do núcleo do laser
laserfix-glow-color=Cor do brilho no chão

[mod-setting-description]
laserfix-doubletint=Aplica a cor selecionada também à camada interna brilhante do feixe de laser, deixando as cores mais profundas e saturadas.
laserfix-color=Escolha entre uma única cor personalizada ou o modo Disco, que dispara uma cor aleatória do arco-íris a cada tiro de laser.
laserfix-core-color=Cor do próprio feixe de laser. Aplica-se apenas quando o modo de cor estiver definido como Cor personalizada.
laserfix-glow-color=Cor da luz projetada no chão abaixo do feixe de laser. Aplica-se apenas quando o modo de cor estiver definido como Cor personalizada.

[string-mod-setting]
laserfix-color-Custom=Cor personalizada
laserfix-color-Disco=Disco (Cores aleatórias)

[string-mod-setting-description]
laserfix-color-Custom=Usa as cores personalizadas configuradas abaixo para todos os feixes de laser e brilho no chão.
laserfix-color-Disco=Seleciona aleatoriamente entre 8 cores vibrantes do arco-íris sempre que um laser dispara.
