[mod-name]
GlowingLaserBeams=发光激光束

[mod-description]
GlowingLaserBeams=自定义激光束的颜色和地面光晕，或开启迪斯科模式，每次射击都会发出随机彩虹颜色。兼容原版及模组激光武器。

[mod-setting-name]
laserfix-doubletint=激光核心双重着色
laserfix-color=激光颜色模式
laserfix-core-color=激光核心颜色
laserfix-glow-color=地面光晕颜色

[mod-setting-description]
laserfix-doubletint=同时将所选颜色应用于激光束明亮的内部光层，使颜色更加深邃饱和。
laserfix-color=选择单一自定义颜色或迪斯科模式（每次激光射击都会随机发出彩虹颜色）。
laserfix-core-color=激光束本身的颜色。仅在激光颜色模式设为“自定义颜色”时生效。
laserfix-glow-color=激光束投射在地面上的光晕颜色。仅在激光颜色模式设为“自定义颜色”时生效。

[string-mod-setting]
laserfix-color-Custom=自定义颜色
laserfix-color-Disco=迪斯科（随机颜色）

[string-mod-setting-description]
laserfix-color-Custom=为所有激光束和地面光晕使用下方设置的自定义颜色。
laserfix-color-Disco=每次激光射击时从 8 种鲜艳的彩虹颜色中随机选择一种。
