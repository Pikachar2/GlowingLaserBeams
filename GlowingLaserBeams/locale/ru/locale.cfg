[mod-name]
GlowingLaserBeams=Светящиеся лазерные лучи

[mod-description]
GlowingLaserBeams=Настройте цвет и свечение на земле для лазерных лучей или включите режим «Диско», чтобы каждый выстрел имел случайный цвет радуги. Работает как с базовым, так и с модовым лазерным оружием.

[mod-setting-name]
laserfix-doubletint=Двойное окрашивание ядра лазера
laserfix-color=Режим цвета лазера
laserfix-core-color=Цвет ядра лазера
laserfix-glow-color=Цвет свечения на земле

[mod-setting-description]
laserfix-doubletint=Применяет выбранный оттенок также к яркому внутреннему световому слою лазерного луча, делая цвета более глубокими и насыщенными.
laserfix-color=Выберите один пользовательский цвет или режим «Диско», в котором каждый выстрел лазера окрашивается в случайный цвет радуги.
laserfix-core-color=Цвет самого лазерного луча. Применяется только если выбран режим «Пользовательский цвет».
laserfix-glow-color=Цвет света, отбрасываемого на землю под лазерным лучом. Применяется только если выбран режим «Пользовательский цвет».

[string-mod-setting]
laserfix-color-Custom=Пользовательский цвет
laserfix-color-Disco=Диско (случайные цвета)

[string-mod-setting-description]
laserfix-color-Custom=Использует выбранные ниже цвета для всех лазерных лучей и свечения на земле.
laserfix-color-Disco=Случайным образом выбирает один из 8 ярких цветов радуги при каждом выстреле лазера.
